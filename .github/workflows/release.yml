name: release

# Pushing a v* tag publishes each package as soon as it is built, without waiting for the others.
# A manual run only builds the packages for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pack.mjs win-x64
      - name: Build app
        shell: pwsh
        run: packaging/windows/build.ps1 -Version (node -p "require('./package.json').version")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
          generate_release_notes: true

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pack.mjs darwin-x64
      - run: bash packaging/macos/build.sh darwin-x64 "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          path: dist/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.dmg
          generate_release_notes: true
